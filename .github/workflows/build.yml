name: APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # GitHub saytidan qo'lda ishga tushirish uchun

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle sozlash
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle wrapper tayyorlash
        run: gradle wrapper --gradle-version 8.7

      - name: APK build qilish (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: APK build qilish (release)
        run: ./gradlew assembleRelease --stacktrace

      - name: Debug APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: DoriEslatma-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: DoriEslatma-release
          path: app/build/outputs/apk/release/*.apk
